plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('run/client1')
            programArgument '--username'
            programArgument 'HFTester1'
            jvmArgument '-Xms512m'
            jvmArgument '-Xmx3G'
        }
        client2 {
            client()
            gameDirectory = layout.projectDirectory.dir('run/client2')
            programArgument '--username'
            programArgument 'HFTester2'
            jvmArgument '-Xms512m'
            jvmArgument '-Xmx3G'
        }
        server {
            server()
            gameDirectory = layout.projectDirectory.dir('run/server')
            programArgument '--nogui'
            jvmArgument '-Xms512m'
            jvmArgument '-Xmx2G'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.harvestfestival
    }
}

repositories {
    mavenCentral()
}

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

testing {
    suites {
        test {
            useJUnitJupiter('5.13.4')
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
